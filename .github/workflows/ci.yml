name: ChronoFlow CPU + Vulkan build checks
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  linux-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK headers and shader tools
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCF_ENABLE_VULKAN=ON -DCF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
